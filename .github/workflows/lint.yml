name: Lint and Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Ruff
      run: pip install ruff

    - name: Collect changed Python files
      id: changed_python
      shell: bash
      run: |
        zero_sha="0000000000000000000000000000000000000000"

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base_sha="${{ github.event.pull_request.base.sha }}"
        else
          base_sha="${{ github.event.before }}"
        fi

        if [ -z "$base_sha" ] || [ "$base_sha" = "$zero_sha" ] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
          base_sha="$(git rev-list --max-parents=0 HEAD)"
        fi

        file_list="$(mktemp)"
        git diff -z --name-only "$base_sha" "${{ github.sha }}" -- '*.py' > "$file_list"

        if [ -s "$file_list" ]; then
          echo "has_files=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_files=false" >> "$GITHUB_OUTPUT"
        fi
        echo "file_list=$file_list" >> "$GITHUB_OUTPUT"

    - name: Run Ruff Lint Check
      if: steps.changed_python.outputs.has_files == 'true'
      run: xargs -0 ruff check < "${{ steps.changed_python.outputs.file_list }}"

    - name: Run Ruff Format Check
      if: steps.changed_python.outputs.has_files == 'true'
      run: xargs -0 ruff format --check < "${{ steps.changed_python.outputs.file_list }}"
