<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Outer ring -->
  <circle cx="20" cy="20" r="18.5" stroke="#0D7A6E" stroke-width="1.8"/>
  <!-- Center agent dot -->
  <circle cx="20" cy="20" r="3.5" fill="#0D7A6E"/>
  <!-- Policy rays (reward signals radiating out) -->
  <line x1="20" y1="20" x2="31.5" y2="10" stroke="#0D7A6E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="34"   y2="21" stroke="#0A9688" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="28"   y2="32" stroke="#0A9688" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="12"   y2="32" stroke="#0D7A6E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="6"    y2="21" stroke="#0D7A6E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="9"    y2="10" stroke="#0D7A6E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Endpoint state dots -->
  <circle cx="31.5" cy="10" r="2.5" fill="#0D7A6E"/>
  <circle cx="34"   cy="21" r="2.5" fill="#0A9688"/>
  <circle cx="28"   cy="32" r="2.5" fill="#0A9688"/>
  <circle cx="12"   cy="32" r="2.5" fill="#0D7A6E"/>
  <circle cx="6"    cy="21" r="2.5" fill="#0D7A6E"/>
  <circle cx="9"    cy="10" r="2.5" fill="#0D7A6E"/>
</svg>
